<!DOCTYPE html>
<html lang="ja">

<head>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <meta name="description" content="ゆーてぃーのアカウント一覧のページ">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts | utml</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/pages/accounts.css">
    <link rel="stylesheet" href="../css/common.css">
</head>

<body>

    <!-- ヘッダー -->
    <div id="header"></div>


    <main class="accounts-container">

        <!-- ページタイトル -->
        <section class="page-heading">
            <p class="section-label">FIND ME ONLINE</p>
            <h1>ACCOUNTS<span>.</span></h1>
            <p>
                利用しているサービスや、各種アカウントを紹介します。
            </p>
        </section>

        <!-- SNS -->
        <section class="account-section">
            <h2>SOCIAL<span>.</span></h2>
            <p class="account-section-description">
                SNS・交流用アカウント
            </p>

            <div id="social-accounts" class="account-grid"></div>
        </section>

        <!-- 競技プログラミング -->
        <section class="account-section">
            <h2>COMPETITIVE PROGRAMMING<span>.</span></h2>
            <p class="account-section-description">
                競技プログラミングの活動記録
            </p>

            <div id="competitive-accounts" class="account-grid"></div>
        </section>

        <!-- 技術系サービス -->
        <section class="account-section">
            <h2>TECHNICAL CONTENT<span>.</span></h2>
            <p class="account-section-description">
                ソースコードや技術記事
            </p>

            <div id="technical-accounts" class="account-grid"></div>
        </section>

        <!-- 動画 -->
        <section class="account-section">
            <h2>VIDEO<span>.</span></h2>
            <p class="account-section-description">
                動画・チャンネル
            </p>

            <div id="video-accounts" class="account-grid"></div>
        </section>

    </main>

    <div id="footer"></div>

    <script src="../js/script.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/data/accounts-data.js"></script>
    <script src="../js/accounts.js"></script>

</body>

</html>
