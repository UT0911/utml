<!DOCTYPE html>
<html lang="ja">

<head>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <meta name="description" content="ゆーてぃーのAtCoderに関する情報のページ">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtCoder | Portfolio</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/pages/atcoder.css">
</head>

<body>

    <div id="header"></div>


    <main class="atcoder-container">

        <a href="../accounts.html" class="back-button">
            ← Accounts
        </a>

        <section class="atcoder-heading">
            <p class="section-label">COMPETITIVE PROGRAMMING</p>
            <h1>AtCoder<span>.</span></h1>

            <p id="atcoder-username" class="atcoder-username">
                @username
            </p>

            <a id="atcoder-profile-link" href="#" target="_blank" rel="noopener noreferrer"
                class="atcoder-external-link">
                AtCoder Profile ↗
            </a>
        </section>

        <section class="atcoder-stats">
            <div class="atcoder-stat">
                <p>Current Rating</p>
                <strong id="current-rating">-</strong>
            </div>

            <div class="atcoder-stat">
                <p>Highest Rating</p>
                <strong id="highest-rating">-</strong>
            </div>

            <div class="atcoder-stat">
                <p>Rank</p>
                <strong id="atcoder-rank">-</strong>
            </div>

            <div class="atcoder-stat">
                <p>Contests</p>
                <strong id="contest-count">-</strong>
            </div>
        </section>

        <section class="atcoder-section">
            <h2>Rating History<span>.</span></h2>
            <p class="atcoder-description">
                コンテスト参加によるレートの推移
            </p>

            <div class="rating-chart">
                <svg id="rating-chart" viewBox="0 0 700 240" preserveAspectRatio="none" role="img"
                    aria-label="AtCoder rating history chart">
                </svg>
                <p id="chart-empty" class="chart-empty">
                    レート履歴がまだ登録されていません。
                </p>
            </div>
        </section>

        <section class="atcoder-section">
            <h2>Contest History<span>.</span></h2>

            <div class="contest-table-wrapper">
                <table class="contest-table">
                    <thead>
                        <tr>
                            <th>Contest</th>
                            <th>Date</th>
                            <th>Rating</th>
                        </tr>
                    </thead>
                    <tbody id="contest-history">
                    </tbody>
                </table>
            </div>
        </section>

        <section class="atcoder-section">
            <h2>About<span>.</span></h2>
            <p id="atcoder-introduction" class="atcoder-introduction"></p>

            <h3>Specialties</h3>
            <div id="atcoder-specialties" class="specialty-list"></div>
        </section>

    </main>

    <div id="footer"></div>

    <script src="../js/script.js"></script>
    <script src="../js/theme.js"></script>
    <script src="js/components.js"></script>
    <script src="../js/atcoder-data.js"></script>
    <script src="../js/atcoder.js"></script>

</body>

</html>
