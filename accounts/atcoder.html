<!DOCTYPE html>
<html lang="ja">

<head>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <meta name="description" content="ゆーてぃーのAtCoderに関する情報のページ">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtCoder | Portfolio</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/pages/atcoder.css">
</head>

<body>

    <div id="header"></div>

    <main class="atcoder-container">

        <a href="../pages/accounts.html" class="back-button">
            ← Accounts
        </a>

        <section class="page-hero">
            <p class="eyebrow">06 / ATCODER</p>
            <h1>AtCoder<span class="gradient-text">.</span></h1>
            <p>競技プログラミングの成績を紹介します。</p>
        </section>

        <section class="atcoder-section">
            <div class="atcoder-rating-panels">

                <!-- Algorithm -->
                <div class="atcoder-profile">
                    <div class="atcoder-profile-header">
                        <h2>Algorithm</h2>
                        <a href="https://atcoder.jp/users/UT0911" target="_blank" rel="noopener noreferrer"
                            class="atcoder-link">
                            Profile →
                        </a>
                    </div>

                    <div id="algorithm-status" class="atcoder-status">
                        Loading...
                    </div>

                    <div id="algorithm-stats" class="atcoder-stats" hidden>
                        <div class="atcoder-stat-card">
                            <p>Current Rating</p>
                            <strong id="algorithm-current">---</strong>
                        </div>
                        <div class="atcoder-stat-card">
                            <p>Highest Rating</p>
                            <strong id="algorithm-highest">---</strong>
                        </div>
                        <div class="atcoder-stat-card">
                            <p>Rated Contests</p>
                            <strong id="algorithm-count">---</strong>
                        </div>
                        <div class="atcoder-stat-card">
                            <p>Last Contest</p>
                            <strong id="algorithm-last">---</strong>
                        </div>
                    </div>
                </div>

                <!-- Heuristic -->
                <div class="atcoder-profile">
                    <div class="atcoder-profile-header">
                        <h2>Heuristic</h2>
                        <a href="https://atcoder.jp/users/UT0911?contestType=heuristic" target="_blank"
                            rel="noopener noreferrer" class="atcoder-link">
                            Profile →
                        </a>
                    </div>

                    <div id="heuristic-status" class="atcoder-status">
                        Loading...
                    </div>

                    <div id="heuristic-stats" class="atcoder-stats" hidden>
                        <div class="atcoder-stat-card">
                            <p>Current Rating</p>
                            <strong id="heuristic-current">---</strong>
                        </div>
                        <div class="atcoder-stat-card">
                            <p>Highest Rating</p>
                            <strong id="heuristic-highest">---</strong>
                        </div>
                        <div class="atcoder-stat-card">
                            <p>Rated Contests</p>
                            <strong id="heuristic-count">---</strong>
                        </div>
                        <div class="atcoder-stat-card">
                            <p>Last Contest</p>
                            <strong id="heuristic-last">---</strong>
                        </div>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <div id="footer"></div>

    <script src="../js/script.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/data/atcoder-data.js"></script>
    <script src="../js/atcoder.js"></script>

</body>

</html>
