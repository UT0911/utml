
name: Update Heuristic Rating

on:
  schedule:
    - cron: "17 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rating:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Heuristic Rating
        run: node .github/scripts/fetch-heuristic.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/heuristic-rating.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Heuristic rating"
            git push
          else
            echo "No changes"
          fi
